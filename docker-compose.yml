services:
  app:
    image: ${DASH14_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8081"
    volumes:
      - ./deploy/config/config.container.yaml:/config/config.yaml:ro
      - ./runtime/data:/data
      - ./runtime/out:/out
      - ./runtime/logs:/logs

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - app
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - run
    volumes:
      - ./deploy/cloudflared:/etc/cloudflared:ro
