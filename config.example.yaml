# dash14 configuration example
# Copy this file to config.yaml and fill in your values.
# config.yaml is git-ignored; never commit real tokens.

telegram:
  # token is the Telegram bot token issued by BotFather.
  # Required for runtime mode; not needed for --import mode.
  token: "123456789:AABBCCDDEEFFaabbccddeeff-example-token"

sqlite:
  # path is the filesystem path to the SQLite database file.
  # The file will be created automatically if it does not exist.
  # Required for both runtime and import mode.
  path: "runtime/data/dash14.db"

overlay:
  # planned_template_path is the HTML template rendered when a game is in the
  # "planned" state (teams announced, match not yet started).
  planned_template_path: "templates/planned.html.tmpl"

  # live_template_path is the HTML template rendered while a game is in
  # progress.
  live_template_path: "templates/live.html.tmpl"

  # intermission_template_path is the HTML template rendered for the
  # standalone intermission scoreboard page.
  intermission_template_path: "templates/intermission.html.tmpl"

  # finished_template_path is the HTML template rendered on the main overlay
  # when the game is over and the final result should be shown.
  finished_template_path: "templates/finished.html.tmpl"

  # output_path is where the rendered overlay HTML file is written.
  # Point your OBS Browser Source at this file.
  output_path: "runtime/out/overlay.html"

  # logo_dir is the managed directory where team logo files are stored.
  # The importer copies logos here and the overlay references them by path.
  logo_dir: "runtime/data/logos"

  # template_cache_refresh_interval_seconds controls how often parsed overlay
  # templates are reloaded from disk.
  # 0 means load templates once at startup and keep them in memory indefinitely.
  template_cache_refresh_interval_seconds: 0

logging:
  # level sets the minimum log level. Accepted values: debug, info, warn, error.
  # Defaults to "info" when omitted.
  level: "info"

  # file_path is an optional path to a log file.
  # When omitted (or empty) logs are written to stderr.
  file_path: "runtime/logs/dash14.log"
